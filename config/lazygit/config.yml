git:
  pagers:
    - pager: >-
        delta --dark --paging=never --line-numbers --hyperlinks
        --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"

gui:
  nerdFontsVersion: "3"
  theme:
    # Gruvbox dark, aligned with tmux/Herdr colors.
    activeBorderColor:
      - "#fabd2f"
      - "bold"
    inactiveBorderColor:
      - "#665c54"
    searchingActiveBorderColor:
      - "#fabd2f"
      - "bold"
    optionsTextColor:
      - "#83a598"
    selectedLineBgColor:
      - "#3c3836"
    cherryPickedCommitFgColor:
      - "#83a598"
    cherryPickedCommitBgColor:
      - "#d3869b"
    markedBaseCommitFgColor:
      - "#83a598"
    markedBaseCommitBgColor:
      - "#fe8019"
    unstagedChangesColor:
      - "#fb4934"
    defaultFgColor:
      - "#ebdbb2"
