- defaults:
    link:
      relink: true

- clean: ["~"]

- link:
    ~/.bashrc: bashrc
    ~/.zshrc: zshrc
    ~/.vimrc: vimrc
    ~/env.sh: env.sh
    ~/.config/alacritty:
      create: true
      path: config/alacritty
    ~/.config/nvim:
      create: true
      path: config/nvim
    ~/.tmux.conf: config/tmux/.tmux.conf
    ~/.tmux.conf.local: tmux.conf.local
    ~/.config/kitty:
      create: true
      path: config/kitty
    ~/.config/gitui:
      create: true
      path: config/gitui
    ~/.config/ghostty:
      create: true
      path: config/ghostty
    ~/.config/herdr/config.toml:
      create: true
      path: config/herdr/config.toml
    ~/.config/herdr/plugins/config/persiyanov.reviewr/config.toml:
      create: true
      path: config/herdr/plugins/config/persiyanov.reviewr/config.toml
    ~/.config/lazygit:
      create: true
      path: config/lazygit
    ~/.config/tmuxinator/dotfiles.yml: config/tmuxinator/dotfiles.yml
    ~/.config/tmuxinator/figma.yml: config/tmuxinator/figma.yml
    ~/.config/tmuxinator/project.yml: config/tmuxinator/project.yml
    ~/.config/tmuxinator/wc.yml: config/tmuxinator/wc.yml
    ~/.claude/CLAUDE.md: config/claude/CLAUDE.md
    ~/.claude/settings.json: config/claude/settings.json
    ~/.claude/statusline-command.sh: config/claude/statusline-command.sh
    ~/.agents/skills:
      create: true
      path: config/agents/skills
    ~/.pi/agent/settings.json:
      create: true
      path: config/pi/agent/settings.json
    ~/.pi/agent/extensions:
      create: true
      path: config/pi/agent/extensions
    ~/.pi/agent/themes:
      create: true
      path: config/pi/agent/themes
    ~/.pi/agent/prompts:
      create: true
      path: config/pi/agent/prompts
    ~/.pi/agent/skills:
      create: true
      path: config/pi/agent/skills

- shell:
    - [git submodule update --init --recursive, Installing submodules]
